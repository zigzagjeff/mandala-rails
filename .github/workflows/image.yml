name: Image

# Builds the production image natively on amd64 and pushes it to GHCR, tagged
# with the full git SHA the way Kamal tags it. Deploys pull this image with
# `bin/kamal deploy -P` instead of building on a server.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read Ruby version
        id: ruby
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zigzagjeff/mandala-rails:${{ github.sha }}
          # Kamal refuses to boot an image without the service label.
          labels: |
            service=mandala_rails
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            RUBY_VERSION=${{ steps.ruby.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
