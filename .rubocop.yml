# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# Rails generates these; the schema dumper's style is not ours to argue with.
# Matches fizzy-main/.rubocop.yml, widened to the Solid schemas Rails 8 ships.
AllCops:
  Exclude:
    - 'db/migrate/**/*'
    - 'db/*schema*.rb'
